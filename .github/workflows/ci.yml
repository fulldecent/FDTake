# FDTake links UIKit, so `xcrun swift test` (the Swift 6 module template's default
# macOS command) does not compile this package. The template's swiftlang workflow
# also needs swiftlang's self-hosted runners.
#
# swift-tools-version 6.4 needs Xcode 27. GitHub's xcode-27 image documents Xcode
# 27.0 (27A266a) as the default, which is the build in the template recipe, and
# lists an iPhone 17 simulator on iOS 27.0:
# https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_CTYPE: en_US.UTF-8
  LANG: en_US.UTF-8
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  test:
    name: Test on iOS
    runs-on: xcode-27

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Show available simulators
      run: xcrun simctl list devices available

    - name: Test Swift package
      run: |
        set -o pipefail
        xcodebuild test \
          -scheme FDTake \
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0'

    - name: Build iOS example app
      run: |
        set -o pipefail
        xcodebuild build \
          -project "iOS Example/iOS Example.xcodeproj" \
          -scheme "iOS Example" \
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0'
